{% extends "base_admin.html" %}
{% block title %}Expense Form{% endblock %}{% block header %}{% if instance %}Edit{% else %}Add{% endif %} Expense{% endblock %}
{% block content %}
<form method="post" class="card max-w-lg space-y-3">
  {% csrf_token %}
  {% for field in form %}
  <div><label class="text-xs text-gray-500 block mb-1">{{ field.label }}</label>{{ field }}</div>
  {% endfor %}
  <button class="btn btn-primary">Save Expense</button>
</form>
{% endblock %}
