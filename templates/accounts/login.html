{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login - SRI KRISHNA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { brand: { 500:'#c4602c',600:'#a3491f',700:'#7f3818',800:'#5c2a13' } } } } }</script>
<style>input[type=text], input[type=password] { width:100%; border:1px solid #d1d5db; border-radius:0.5rem; padding:0.6rem 0.75rem; }</style>
</head>
<body class="bg-gradient-to-br from-brand-800 to-brand-500 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-2xl font-bold text-brand-700">SRI KRISHNA</div>
      <div class="text-sm text-gray-500">Fashion for Every Generation</div>
      <div class="text-xs text-gray-400 mt-2">Shop Management Staff Login</div>
    </div>
    {% if form.errors %}<div class="bg-red-100 text-red-700 text-sm rounded p-3 mb-4">Invalid username or password.</div>{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div><label class="text-xs text-gray-500 block mb-1">Username</label>{{ form.username }}</div>
      <div><label class="text-xs text-gray-500 block mb-1">Password</label>{{ form.password }}</div>
      <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg py-2.5">Login</button>
    </form>
    <div class="text-center text-xs text-gray-400 mt-4">Demo: admin / admin123</div>
    <div class="text-center text-xs mt-2"><a href="/" class="text-brand-600">← Back to storefront</a></div>
  </div>
</body>
</html>
