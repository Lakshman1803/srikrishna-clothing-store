{% extends "storefront/public_base.html" %}
{% block title %}Contact Us - SRI KRISHNA{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
  <h1 class="text-3xl font-bold mb-6">Contact Us</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div><label class="text-xs text-gray-500 block mb-1">Your Name</label><input type="text" name="name" required class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-xs text-gray-500 block mb-1">Mobile</label><input type="text" name="mobile" required class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-xs text-gray-500 block mb-1">Message</label><textarea name="message" rows="4" class="w-full border rounded px-3 py-2"></textarea></div>
    <button class="btn btn-primary">Send Message</button>
  </form>
  <div class="mt-8 text-sm text-gray-500">
    <div>📞 {{ shop.phone }}</div><div>💬 WhatsApp: {{ shop.whatsapp }}</div><div>✉️ {{ shop.email }}</div>
  </div>
</div>
{% endblock %}
